name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # Create the GitHub Release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Enforces the org invariant "git tag == .asd :version" at the only point
      # where it can still be corrected cheaply. Without this gate the two drift
      # silently, which is how cl-boundary-kit reached :version 1.0.0 while its
      # newest tag was still v0.6.0.
      #
      # PACKAGE is the env var name and must stay literal; only its value is
      # this repository's system name.
      - name: Verify tag matches .asd version
        env:
          PACKAGE: cl-vcs-kit
        run: |
          set -euo pipefail
          asd_version="$(sed -n 's/^[[:space:]]*:version "\([^"]*\)".*/\1/p' "$PACKAGE.asd" | head -n1)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "asd=$asd_version tag=$tag_version"
          if [[ "$asd_version" != "$tag_version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match $PACKAGE.asd version $asd_version" >&2
            exit 1
          fi

      - uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # Never publish a release that does not pass its own test suite.
      - name: Verify the tagged tree
        run: nix flake check --print-build-logs

      # Creates the release as an empty draft. This workflow does not produce a
      # release body at all.
      #
      # As of the 2026-08-01 revision the GitHub Release description is the only
      # There is no CHANGELOG.md. RELEASE_STANDARD.md defines the release notes.
      # See RELEASE_STANDARD.md. After this job goes green the maintainer fills
      # the body in and publishes:
      #
      #   gh release edit "$GITHUB_REF_NAME" --notes-file <file> --draft=false
      #
      # Keep `draft: true` until the maintainer fills in the release notes.
      # Draft releases are excluded from "Latest release" and `gh release list`.
      #
      # Leave `generate_release_notes` off. It produces commit titles and PR
      # numbers, while RELEASE_STANDARD.md requires notes about user code
      # changes.
      #
      # Every `uses:` in this org references a 40-character SHA, never a mutable
      # tag. Re-resolve before bumping, and do not copy a SHA you have not
      # resolved yourself:
      #   gh api repos/softprops/action-gh-release/git/ref/tags/v3 --jq .object.sha
      - name: Create draft release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          draft: true
